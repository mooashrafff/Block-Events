<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/block-logo.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/block-logo.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/block-logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile – BLOCK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/block-theme.css">
  <link rel="stylesheet" href="/site-chrome.css">
  <script>
    (function() {
      var isFile = location.protocol === 'file:';
      var isWrongPort = location.hostname === 'localhost' && location.port !== '3001' && location.port !== '';
      if (isFile || isWrongPort) {
        var base = document.createElement('base');
        base.href = 'http://localhost:3001/';
        document.head.appendChild(base);
      }
    })();
  </script>
  <style>
    :root {
      --page-bg: var(--lux-body-stack, linear-gradient(180deg, #000 0%, #141414 100%));
      --card: #141414;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f5f3ef;
      --muted: #9b968f;
      --accent: #ebe8e2;
      --accent-hover: #ffffff;
      --accent-purple: #c4b8a8;
      --inp-bg: #101010;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--page-bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .page-main {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem clamp(0.75rem, 3vw, 1.25rem) 3rem;
    }
    .page-main h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.35rem; }
    .sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.35rem; }
    .grid {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 1.25rem;
      align-items: start;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.35rem 1.25rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }
    .profile-head { display: flex; gap: 1rem; align-items: flex-start; flex-wrap: wrap; }
    .avatar-stack { position: relative; flex-shrink: 0; }
    .avatar-ring {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid var(--border);
      padding: 0;
      margin: 0;
      background: var(--inp-bg);
      cursor: pointer;
      display: block;
      overflow: visible;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .avatar-ring:hover { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12); }
    .avatar-ring:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .avatar-ring:disabled { opacity: 0.7; cursor: wait; }
    .avatar-fill {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .avatar-fill img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar-letter { font-size: 1.35rem; font-weight: 700; color: var(--muted); }
    .avatar-edit-badge {
      position: absolute;
      right: -4px;
      bottom: -4px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--card);
      display: grid;
      place-items: center;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }
    .avatar-edit-badge svg { width: 14px; height: 14px; color: #fff; }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .meta-block { flex: 1; min-width: 0; }
    .row-pills { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.4rem; }
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-weight: 600;
      font-size: 0.82rem;
      background: var(--inp-bg);
      max-width: 100%;
      word-break: break-all;
    }
    .name-display { font-size: 1.2rem; font-weight: 700; }
    .field { margin-top: 1rem; }
    label {
      display: block;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--inp-bg);
      color: var(--text);
      font: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 0.65rem; margin-top: 1.1rem; }
    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--accent-purple); }
    .btn:disabled { opacity: 0.65; cursor: not-allowed; }
    .btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .btn.secondary:hover {
      border-color: var(--accent);
      color: var(--accent-hover);
      background: rgba(255, 255, 255, 0.06);
    }
    .msg {
      margin-top: 0.85rem;
      padding: 10px 12px;
      border-radius: 10px;
      display: none;
      font-size: 0.92rem;
    }
    .msg.show { display: block; }
    .msg.error {
      border: 1px solid rgba(248, 113, 113, 0.35);
      background: rgba(248, 113, 113, 0.1);
      color: #fecaca;
    }
    .msg.success {
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.08);
      color: #b8d4ff;
    }
    .bookings { display: flex; flex-direction: column; gap: 0.75rem; }
    .booking {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem;
      display: flex;
      gap: 0.9rem;
      background: var(--inp-bg);
    }
    .booking-thumb-wrap {
      width: 96px;
      height: 72px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #2a2a2a;
      overflow: hidden;
      flex-shrink: 0;
    }
    .booking-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .booking h3 { font-size: 1.05rem; margin-bottom: 0.15rem; }
    .meta { color: var(--muted); font-size: 0.9rem; }
    .price { margin-top: 0.4rem; font-weight: 700; }
    .card h2 { font-size: 1.15rem; font-weight: 700; }
    .count-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; }
    @media (max-width: 920px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="site-chrome-header">
    <div class="site-chrome-header__inner">
      <a href="/" class="site-chrome-header__logo-wrap" aria-label="BLOCK Home">
        <img src="/block-logo.png" alt="" class="site-chrome-header__logo-img" width="120" height="26">
      </a>
      <nav class="site-chrome-nav site-chrome-nav--header" aria-label="Main">
        <a href="/" data-nav-match="/">Home</a>
        <a href="/events" data-nav-match="/events">Events</a>
        <a href="/my-tickets" data-nav-match="/my-tickets">My Tickets</a>
        <a href="/contact" data-nav-match="/contact">Contact Us</a>
        <a href="/about-us" data-nav-match="/about-us">About</a>
      </nav>
      <div class="site-chrome-header__account">
        <a href="/profile" class="site-chrome-header__account-link" data-nav-match="/profile">Account</a>
        <a href="/auth" class="site-chrome-header__signin">Sign in</a>
        <button type="button" class="site-chrome-header__signout" id="siteChromeSignOut" hidden>Sign out</button>
      </div>
    </div>
  </header>

  <main class="page-main">
    <h1>Profile</h1>
    <p class="sub" id="sub">Loading…</p>

    <div class="grid">
      <section class="card">
        <div class="profile-head">
          <div class="avatar-stack">
            <input type="file" id="avatarFile" class="visually-hidden" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,.jpg,.jpeg,.png,.webp,.gif,.avif" aria-hidden="true" tabindex="-1" />
            <button type="button" class="avatar-ring" id="avatarTrigger" aria-label="Change profile photo">
              <span class="avatar-fill" id="avatarFill">
                <span class="avatar-letter" id="avatarLetter">U</span>
              </span>
              <span class="avatar-edit-badge" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
              </span>
            </button>
          </div>
          <div class="meta-block">
            <div class="row-pills">
              <span class="pill" id="pillEmail">—</span>
              <span class="pill" id="pillSince">—</span>
            </div>
            <div class="name-display" id="nameText">—</div>
          </div>
        </div>

        <form id="profileForm">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" type="text" name="name" autocomplete="name" placeholder="Your name">
          </div>
          <div class="actions">
            <button class="btn" id="btnSave" type="submit">Save profile</button>
            <a class="btn secondary" href="/events">Browse events</a>
          </div>
          <div id="msg" class="msg" role="alert"></div>
        </form>
      </section>

      <section class="card">
        <div class="count-header">
          <h2>Booked events</h2>
          <span class="pill" id="countPill">0</span>
        </div>
        <div id="bookings" class="bookings"></div>
        <p id="empty" class="meta" style="display:none; padding:0.5rem 0 0;">No bookings yet. Add an event to your cart and checkout.</p>
      </section>
    </div>
  </main>

  <footer class="site-chrome-footer">
    <div class="site-chrome-footer__inner">
      <a href="/" class="site-chrome-footer__logo-wrap" aria-label="BLOCK Home">
        <img src="/block-logo.png" alt="" class="site-chrome-footer__logo-img" width="100" height="22">
      </a>
      <nav class="site-chrome-nav site-chrome-nav--footer" aria-label="Footer">
        <a href="/" data-nav-match="/">Home</a>
        <a href="/events" data-nav-match="/events">Events</a>
        <a href="/my-tickets" data-nav-match="/my-tickets">My Tickets</a>
        <a href="/contact" data-nav-match="/contact">Contact Us</a>
        <a href="/about-us" data-nav-match="/about-us">About</a>
      </nav>
      <span class="site-chrome-footer__copy" id="siteChromeCopyright">© BLOCK</span>
    </div>
  </footer>

  <script src="/site-chrome.js" defer></script>
  <script>
    const msg = document.getElementById('msg');
    const avatarTrigger = document.getElementById('avatarTrigger');
    const avatarFile = document.getElementById('avatarFile');
    const avatarFill = document.getElementById('avatarFill');
    const avatarLetter = document.getElementById('avatarLetter');

    function show(type, text) {
      msg.textContent = text || '';
      msg.className = 'msg show ' + (type || '');
      if (!text) msg.className = 'msg';
    }

    function money(n) {
      const v = Number(n || 0);
      if (!isFinite(v) || v <= 0) return 'FREE';
      return v.toFixed(2) + ' EGP';
    }

    function fmtDate(d) {
      if (!d) return '';
      try { return new Date(d).toLocaleString(); } catch (e) { return String(d); }
    }

    function escAttr(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    async function requireMe() {
      const r = await fetch('/api/auth/me', { credentials: 'same-origin' });
      const data = await r.json().catch(() => ({}));
      if (!data || !data.user) {
        location.href = '/auth?next=' + encodeURIComponent('/profile');
        return null;
      }
      return data;
    }

    function setAvatarDisplay(user) {
      avatarLetter.style.display = 'none';
      const existingImg = avatarFill.querySelector('img');
      if (existingImg) existingImg.remove();

      if (user.profile_picture_url) {
        const img = document.createElement('img');
        img.alt = '';
        img.src = user.profile_picture_url;
        img.referrerPolicy = 'no-referrer';
        avatarFill.insertBefore(img, avatarLetter);
        avatarLetter.style.display = 'none';
      } else {
        avatarLetter.textContent = (user.email || 'U').trim().slice(0, 1).toUpperCase() || 'U';
        avatarLetter.style.display = '';
      }
    }

    function render(me) {
      const user = me.user;
      document.getElementById('sub').textContent = 'Manage your info and bookings.';
      document.getElementById('pillEmail').textContent = user.email;
      document.getElementById('pillSince').textContent = 'Joined ' + fmtDate(user.created_at).split(',')[0];
      document.getElementById('nameText').textContent = user.name || 'Your account';
      document.getElementById('name').value = user.name || '';
      setAvatarDisplay(user);

      const list = Array.isArray(me.bookedEvents) ? me.bookedEvents : [];
      document.getElementById('countPill').textContent = String(list.length);
      const wrap = document.getElementById('bookings');
      const empty = document.getElementById('empty');
      if (!list.length) {
        wrap.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      wrap.innerHTML = list.map(function (b) {
        const e = b.event || {};
        const paymentStatus = b.paymentStatus || 'Pending';
        const pm = b.paymentMethod || (Number(e.price || 0) > 0 ? 'card' : 'free');
        const priceTxt = money(e.price);
        const paidTxt = money(b.pricePaid);
        const isPaid = paymentStatus === 'Paid';
        const ticketsCount = Math.max(0, Number(b.ticketsCount || (Array.isArray(b.ticketIds) ? b.ticketIds.length : 0)) || 0);
        const ticketUrl = ticketsCount > 1
          ? '/my-tickets'
          : (b.ticketId ? '/ticket/' + encodeURIComponent(b.ticketId) : null);
        const ticketBtnLabel = ticketsCount > 1 ? 'View tickets / QR' : 'View ticket / QR';
        return '<div class="booking">' +
          '<div class="booking-thumb-wrap"><img alt="" src="' + (e.imageCard || e.image || '/block-logo.png').replace(/"/g, '&quot;') + '"></div>' +
          '<div style="flex:1; min-width:0;">' +
            '<h3 style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + (e.name || 'Event') + '</h3>' +
            '<div class="meta">' + [e.date, e.time, e.venue].filter(Boolean).join(' · ') + '</div>' +
            '<div class="meta" style="margin-top:0.25rem;">Booked ' + fmtDate(b.createdAt) + '</div>' +
            '<div class="meta" style="margin-top:0.25rem;">Tickets: <strong>' + String(ticketsCount || 0) + '</strong></div>' +
            '<div class="price">' + (priceTxt === 'FREE' ? 'FREE' : (isPaid ? ('Paid ' + paidTxt + ' via ' + String(pm).toUpperCase()) : (paymentStatus + ' via ' + String(pm).toUpperCase()))) + '</div>' +
            (ticketUrl
              ? '<div style="margin-top:0.6rem;"><a class="btn secondary" href="' + ticketUrl + '" style="display:inline-flex; text-decoration:none;">' + ticketBtnLabel + '</a></div>'
              : '') +
            (b.instapayQrImageUrl && b.instapayPaymentUrl && !ticketUrl
              ? '<div style="margin-top:0.6rem;padding:0.75rem;border:1px solid var(--border);border-radius:12px;background:#121212;">' +
                '<div class="meta" style="margin-bottom:0.35rem;">InstaPay — waiting for admin confirmation</div>' +
                '<img alt="InstaPay QR" src="' + escAttr(b.instapayQrImageUrl) + '" style="width:180px;max-width:100%;border-radius:12px;border:1px solid var(--border);background:#fff;">' +
                '<div style="margin-top:0.5rem;"><a href="' + escAttr(b.instapayPaymentUrl) + '" target="_blank" rel="noopener noreferrer" style="color:var(--accent);font-weight:600;word-break:break-all;font-size:0.9rem;">Open InstaPay payment link</a></div>' +
                (b.instapaySenderPhone
                  ? '<div class="meta" style="margin-top:0.5rem;">Paid from: <strong>' + escAttr(b.instapaySenderPhone) + '</strong></div>'
                  : '<div class="meta" style="margin-top:0.5rem;">After paying, add the phone number you used on the <a href="/instapay-success?bookingIds=' + encodeURIComponent(b.id) + '" style="color:var(--accent);font-weight:600;">InstaPay pending</a> page.</div>') +
                '</div>'
              : '') +
          '</div>' +
        '</div>';
      }).join('');
    }

    avatarTrigger.addEventListener('click', function () {
      avatarFile.click();
    });

    avatarFile.addEventListener('change', async function () {
      const file = avatarFile.files && avatarFile.files[0];
      avatarFile.value = '';
      if (!file) return;
      show('', '');
      avatarTrigger.disabled = true;
      try {
        const fd = new FormData();
        fd.append('avatar', file);
        const res = await fetch('/api/auth/profile/avatar', {
          method: 'POST',
          body: fd,
          credentials: 'same-origin',
        });
        const raw = await res.text();
        let data = {};
        try {
          data = raw ? JSON.parse(raw) : {};
        } catch (_) {
          data = {};
        }
        if (!res.ok) {
          let hint = data.error || '';
          if (!hint && raw) {
            const m = raw.match(/<pre[^>]*>([^<]+)<\/pre>/i);
            if (m) hint = m[1].trim();
            else if (raw.length < 400) hint = raw.trim();
          }
          if (!hint) hint = 'Request failed (' + res.status + ').';
          if (/cannot post\s+\/api\/auth\/profile\/avatar/i.test(hint) || (res.status === 404 && /html/i.test(res.headers.get('content-type') || ''))) {
            hint =
              'Photo upload is not reachable (API404). Open the site on your Node server URL (e.g. http://localhost:3001 after npm start), or redeploy so server.js with the avatar route is live.';
          }
          throw new Error(hint || 'Upload failed.');
        }
        show('success', 'Profile photo updated.');
        const me = await requireMe();
        if (me) render(me);
      } catch (err) {
        show('error', err.message || 'Could not upload photo.');
      } finally {
        avatarTrigger.disabled = false;
      }
    });

    document.getElementById('profileForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      show('', '');
      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        const name = document.getElementById('name').value.trim();
        const res = await fetch('/api/auth/profile', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ name }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Could not save.');
        show('success', 'Profile updated.');
        const me = await requireMe();
        if (me) render(me);
      } catch (err) {
        show('error', err.message || 'Save failed.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save profile';
      }
    });

    (async function init() {
      const me = await requireMe();
      if (me) render(me);
    })();
  </script>
</body>
</html>
