<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event – BLOCK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/block-theme.css">
  <link rel="stylesheet" href="/site-chrome.css">
  <script>
    (function() {
      var isFile = location.protocol === 'file:';
      var isWrongPort = location.hostname === 'localhost' && location.port !== '3001' && location.port !== '';
      if (isFile || isWrongPort) {
        var base = document.createElement('base');
        base.href = 'http://localhost:3001/';
        document.head.appendChild(base);
      }
    })();
  </script>
  <style>
    :root {
      --bg: #0a0a0c;
      --card: #141418;
      --border: #25252d;
      --text: #e8e8ed;
      --muted: #8888a0;
      --accent: #0066ff;
      --accent-hover: #7c3aed;
      --bar-bg: #ffffff;
      --bar-text: #1a1a1a;
      --bar-muted: #5a5a5a;
      --search-bg: #f0f0f0;
      --detail-panel: #1a1a1a;
      --detail-bg: #121212;
      --gold: #c9a227;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; width: 100%; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      padding-bottom: 3rem;
      background-image: radial-gradient(ellipse 80% 40% at 50% -10%, rgba(0, 102, 255, 0.12), transparent);
    }
    .event-detail-wrap { width: 100%; max-width: min(1400px, 96vw); margin: 0 auto; padding: 0 clamp(0.75rem, 3vw, 1.25rem); }
    .event-detail-card {
      background: var(--detail-bg);
      border-radius: 20px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
      min-height: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    @media (max-width: 768px) { .event-detail-card { grid-template-columns: 1fr; } }
    .event-detail-panel {
      background: var(--detail-panel);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-radius: 20px 0 0 20px;
    }
    @media (max-width: 768px) { .event-detail-panel { border-radius: 20px 20px 0 0; } }
    .event-detail-panel h1 { font-size: 1.75rem; font-weight: 700; color: #ffffff; margin-bottom: 0.5rem; line-height: 1.25; }
    .event-detail-panel .meta { color: var(--bar-muted); font-size: 1rem; margin-bottom: 0.25rem; }
    .event-detail-panel .venue { color: var(--bar-muted); font-size: 0.95rem; margin-bottom: 1rem; }
    .event-detail-panel .organizer { color: var(--bar-muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
    .event-detail-actions { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .btn-book {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 24px;
      font: inherit; font-size: 1rem; font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none; border-radius: 12px;
      cursor: pointer; text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-book:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-book svg { width: 20px; height: 20px; flex-shrink: 0; }
    .btn-cart {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 18px;
      font: inherit; font-size: 0.95rem; font-weight: 700;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-cart:hover { border-color: var(--accent); color: var(--accent); }
    .toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 18px;
      background: rgba(20,20,24,0.92);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.95rem;
      max-width: min(520px, 92vw);
      display: none;
      z-index: 50;
    }
    .toast.show { display: block; }
    .event-detail-image-wrap {
      position: relative;
      overflow: hidden;
      background: #1a1a1a;
      border-radius: 0 20px 20px 0;
      align-self: start;
      width: 100%;
      height: 380px;
      min-height: 300px;
      max-height: 420px;
    }
    .event-detail-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    @media (max-width: 768px) {
      .event-detail-image-wrap {
        border-radius: 0;
        height: clamp(260px, 52vw, 360px);
        min-height: 260px;
        max-height: 360px;
      }
      .event-detail-panel { padding: 1.5rem; }
      .event-detail-panel h1 { font-size: 1.4rem; }
      .event-detail-actions { gap: 0.75rem; }
      .btn-book { padding: 12px 20px; font-size: 0.95rem; }
    }
    @media (max-width: 480px) {
      .event-detail-panel { padding: 1.25rem; }
      .event-detail-panel h1 { font-size: 1.25rem; }
      .event-detail-actions { flex-direction: column; align-items: flex-start; }
      .btn-book { width: 100%; justify-content: center; }
    }

    .about-section { width: 100%; max-width: min(1400px, 96vw); margin: 2rem auto 0; padding: 0 clamp(0.75rem, 3vw, 1.25rem); }
    .about-section h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.75rem; color: var(--text); }
    .about-section p { color: var(--muted); font-size: 1rem; line-height: 1.6; margin-bottom: 1rem; }
    .btn-layout {
      display: inline-block;
      padding: 10px 20px;
      font: inherit; font-size: 0.95rem; font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none; border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-layout:hover { background: var(--accent-hover); }

    .upcoming-section { width: 100%; max-width: min(1400px, 96vw); margin: 2.5rem auto 0; padding: 0 clamp(0.75rem, 3vw, 1.25rem); }
    .upcoming-section h2 { font-size: 1.35rem; font-weight: 700; margin-bottom: 1.25rem; color: var(--text); }
    .events-carousel {
      display: flex; gap: 1.25rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 0.5rem;
      -webkit-overflow-scrolling: touch;
    }
    .events-carousel::-webkit-scrollbar { height: 8px; }
    .events-carousel::-webkit-scrollbar-track { background: var(--card); border-radius: 4px; }
    .events-carousel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .event-card-link {
      flex: 0 0 280px;
      min-height: 320px;
      scroll-snap-align: start;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .event-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 320px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    .event-card-link:hover .event-card {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(0, 102, 255, 0.18), 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    .event-card-image-wrap {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      height: 200px;
      min-height: 180px;
      max-height: 220px;
      overflow: hidden;
      background: var(--border);
    }
    .event-card-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    @media (max-width: 480px) {
      .event-card-image-wrap {
        height: 160px;
        min-height: 160px;
        max-height: 180px;
      }
    }
    .event-card-body { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; }
    .event-card-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.5rem; line-height: 1.3; }
    .event-card-meta { color: var(--muted); font-size: 0.875rem; margin-bottom: 0.5rem; }
    .event-card-venue { color: var(--muted); font-size: 0.85rem; }

    .loading, .error { text-align: center; color: var(--muted); padding: 3rem 1.25rem; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <header class="site-chrome-header">
    <div class="site-chrome-header__inner">
      <a href="/" class="site-chrome-header__logo-wrap" aria-label="BLOCK Home">
        <img src="/block-logo.png" alt="" class="site-chrome-header__logo-img" width="120" height="26">
      </a>
      <nav class="site-chrome-nav site-chrome-nav--header" aria-label="Main">
        <a href="/" data-nav-match="/">Home</a>
        <a href="/events" data-nav-match="/events">Events</a>
        <a href="/my-tickets" data-nav-match="/my-tickets">My Tickets</a>
        <a href="/contact" data-nav-match="/contact">Contact Us</a>
        <a href="/about-us" data-nav-match="/about-us">About</a>
      </nav>
      <div class="site-chrome-header__account">
        <a href="/profile" class="site-chrome-header__account-link" data-nav-match="/profile">Account</a>
        <a href="/auth" class="site-chrome-header__signin">Sign in</a>
        <button type="button" class="site-chrome-header__signout" id="siteChromeSignOut">Sign out</button>
      </div>
    </div>
  </header>

  <div id="eventDetailWrap" class="event-detail-wrap" style="display: none;">
    <div class="event-detail-card">
      <div class="event-detail-panel">
        <h1 id="eventTitle">Event name</h1>
        <p class="meta" id="eventMeta">Date | Time</p>
        <p class="venue" id="eventVenue">Venue</p>
        <p class="organizer">Organized by <strong>BLOCK</strong></p>
        <div class="event-detail-actions">
          <button id="bookNowBtn" type="button" class="btn-book">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
            </svg>
            Book Now
          </button>
          <button id="addToCartBtn" type="button" class="btn-cart">Add to cart</button>
        </div>
      </div>
      <div class="event-detail-image-wrap">
        <img id="eventImage" class="event-detail-image" src="" alt="">
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="aboutWrap" class="about-section" style="display: none;">
    <h2>About Event</h2>
    <p id="eventDescription"></p>
    <button type="button" class="btn-layout" id="layoutBtn">Layout</button>
  </div>

  <div id="upcomingWrap" class="upcoming-section" style="display: none;">
    <h2>Upcoming Events</h2>
    <div id="upcomingCarousel" class="events-carousel"></div>
  </div>

  <div id="loadingEl" class="loading">Loading event…</div>
  <div id="errorEl" class="error" style="display: none;"></div>

  <footer class="site-chrome-footer">
    <div class="site-chrome-footer__inner">
      <a href="/" class="site-chrome-footer__logo-wrap" aria-label="BLOCK Home">
        <img src="/block-logo.png" alt="" class="site-chrome-footer__logo-img" width="100" height="22">
      </a>
      <nav class="site-chrome-nav site-chrome-nav--footer" aria-label="Footer">
        <a href="/" data-nav-match="/">Home</a>
        <a href="/events" data-nav-match="/events">Events</a>
        <a href="/my-tickets" data-nav-match="/my-tickets">My Tickets</a>
        <a href="/contact" data-nav-match="/contact">Contact Us</a>
        <a href="/about-us" data-nav-match="/about-us">About</a>
      </nav>
      <span class="site-chrome-footer__copy" id="siteChromeCopyright">© BLOCK</span>
    </div>
  </footer>

  <script src="/site-chrome.js" defer></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get('id');
    const shouldAutoBook = params.get('book') === '1' || params.get('book') === 'true';
    const eventDetailWrap = document.getElementById('eventDetailWrap');
    const eventTitle = document.getElementById('eventTitle');
    const eventMeta = document.getElementById('eventMeta');
    const eventVenue = document.getElementById('eventVenue');
    const bookNowBtn = document.getElementById('bookNowBtn');
    const addToCartBtn = document.getElementById('addToCartBtn');
    const toast = document.getElementById('toast');
    const eventImage = document.getElementById('eventImage');
    const aboutWrap = document.getElementById('aboutWrap');
    const eventDescription = document.getElementById('eventDescription');
    const upcomingWrap = document.getElementById('upcomingWrap');
    const upcomingCarousel = document.getElementById('upcomingCarousel');
    const loadingEl = document.getElementById('loadingEl');
    const errorEl = document.getElementById('errorEl');
    // Prevent auto-click before the handlers are attached (fixes double-click issue).
    bookNowBtn.disabled = true;
    var bookingHandlerReady = false;

    function showError(msg) {
      loadingEl.style.display = 'none';
      eventDetailWrap.style.display = 'none';
      aboutWrap.style.display = 'none';
      upcomingWrap.style.display = 'none';
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    var fallbackEvents = [
      { id: 'ramadan-palace', name: 'Laylina Tent at Mohamed Ali Palace', date: 'Ramadan 2026', time: '', venue: 'Mohamed Ali Palace', image: '/block-logo.png', description: 'An unforgettable Ramadan experience at Mohamed Ali Palace.' },
      { id: 'comedy-show', name: 'Konafa ADHD Interactive Comedy Show', date: 'Feb 27', time: '09:00 PM', venue: 'El Rihany Theater', image: '/block-logo.png', description: 'Interactive comedy night at El Rihany Theater.' },
      { id: 'zed-park', name: 'ZED PARK', date: 'Feb 19 to Mar 19', time: '08:00 PM', venue: 'Zed Park, Elsheikh Zayed', image: '/block-logo.png', description: 'Live events at Zed Park throughout the season.' }
    ];
      function showEvent(event, others) {
      loadingEl.style.display = 'none';
      errorEl.style.display = 'none';
      eventDetailWrap.style.display = 'block';
      document.title = event.name + ' – BLOCK';
      eventTitle.textContent = event.name;
      eventMeta.textContent = [event.date, event.time].filter(Boolean).join(' | ');
      eventVenue.textContent = event.venue;
        addToCartBtn.onclick = async function () {
          addToCartBtn.disabled = true;
          try {
            var r = await fetch('/api/cart/add', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ eventId: event.id })
            });
            var d = await r.json();
            if (r.status === 401) {
              window.location.href = '/auth?next=' + encodeURIComponent('/event?id=' + encodeURIComponent(event.id) + '&book=1');
              return;
            }
            if (!r.ok) throw new Error(d.error || 'Could not add to cart.');
            toast.textContent = 'Added to cart. Open Cart to checkout.';
            toast.classList.add('show');
            setTimeout(function () { toast.classList.remove('show'); }, 1200);
          } catch (e) {
            toast.textContent = e.message || 'Could not add to cart.';
            toast.classList.add('show');
            setTimeout(function () { toast.classList.remove('show'); }, 1500);
          } finally {
            addToCartBtn.disabled = false;
          }
        };

        bookingHandlerReady = true;
        bookNowBtn.disabled = false;
        bookNowBtn.onclick = async function () {
          bookNowBtn.disabled = true;
          try {
            var me = await fetch('/api/auth/me').then(function (r) { return r.json(); }).catch(function () { return null; });
            if (!me || !me.user) {
              window.location.href = '/auth?next=' + encodeURIComponent('/event?id=' + encodeURIComponent(event.id) + '&book=1');
              return;
            }
            var r = await fetch('/api/cart/add', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ eventId: event.id })
            });
            var d = await r.json().catch(function(){ return {}; });
            if (!r.ok) throw new Error(d.error || 'Could not add to cart.');
            toast.textContent = 'Starting checkout…';
            toast.classList.add('show');
            setTimeout(function () { toast.classList.remove('show'); }, 900);
            window.location.href = '/checkout';
          } catch (e) {
            toast.textContent = e.message || 'Could not start booking.';
            toast.classList.add('show');
            setTimeout(function () { toast.classList.remove('show'); }, 1500);
          } finally {
            bookNowBtn.disabled = false;
          }
        };

      eventImage.src = event.imageHero || event.image || '/block-logo.png';
      eventImage.alt = event.name;
      if (event.description) {
        aboutWrap.style.display = 'block';
        eventDescription.textContent = event.description;
      }
      if (others && others.length > 0) {
        upcomingWrap.style.display = 'block';
        upcomingCarousel.innerHTML = others.map(function (e) {
          return '<a href="/event?id=' + encodeURIComponent(e.id) + '" class="event-card-link">' +
            '<article class="event-card">' +
            '<div class="event-card-image-wrap">' +
            '<img class="event-card-image" src="' + (e.imageCard || e.image || '/block-logo.png') + '" alt="' + e.name.replace(/"/g, '&quot;') + '">' +
            '</div>' +
            '<div class="event-card-body">' +
            '<h3 class="event-card-title">' + e.name + '</h3>' +
            '<div class="event-card-meta">' + (e.date + (e.time ? ' | ' + e.time : '')) + '</div>' +
            '<div class="event-card-venue">' + (e.venue || '') + '</div>' +
            '</div></article></a>';
        }).join('');
      }
    }
    async function loadEvent() {
      if (!eventId) {
        showError('No event selected.');
        return;
      }
      var events = null;
      try {
        var res = await fetch('/api/events');
        var data = await res.json();
        if (res.ok && Array.isArray(data)) events = data;
      } catch (e) {}
      if (!events || events.length === 0) {
        try {
          var res2 = await fetch('events.json');
          var data2 = await res2.json();
          if (Array.isArray(data2)) events = data2;
        } catch (e2) {}
      }
      if (!events || events.length === 0) events = fallbackEvents;
      var event = events.find(function (e) { return e.id === eventId; });
      if (!event) {
        showError('Event not found.');
        return;
      }
      var others = events.filter(function (e) { return e.id !== eventId; });
      showEvent(event, others);
    }

    document.getElementById('layoutBtn').addEventListener('click', function () {
      alert('Venue layout view can be added here.');
    });
    loadEvent();

    // Auto-book after login (e.g. when coming from homepage with ?book=1)
    if (shouldAutoBook) {
      // Wait until showEvent sets up handlers, then click.
      var _tries = 0;
      var timer = setInterval(function () {
        _tries += 1;
        if (bookNowBtn && bookingHandlerReady && !bookNowBtn.disabled && eventId && typeof bookNowBtn.onclick === 'function') {
          clearInterval(timer);
          bookNowBtn.click();
        }
        if (_tries > 20) clearInterval(timer);
      }, 250);
    }
  </script>
</body>
</html>
