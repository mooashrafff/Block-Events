<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/block-logo.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/block-logo.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/block-logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events – BLOCK | Browse &amp; Book Tickets</title>
  <meta name="description" content="Browse upcoming events on BLOCK — live shows, sports, and culture. Search by name, compare prices, and book tickets with secure checkout.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://block-events.vercel.app/events">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Events – BLOCK">
  <meta property="og:description" content="Browse and book tickets for live events — concerts, sports, and more.">
  <meta property="og:url" content="https://block-events.vercel.app/events">
  <meta property="og:image" content="https://block-events.vercel.app/block-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/block-theme.css">
  <link rel="stylesheet" href="/site-chrome.css">
  <script>
    (function() {
      var isFile = location.protocol === 'file:';
      var isWrongPort = location.hostname === 'localhost' && location.port !== '3001' && location.port !== '';
      if (isFile || isWrongPort) {
        var base = document.createElement('base');
        base.href = 'http://localhost:3001/';
        document.head.appendChild(base);
      }
    })();
  </script>
  <style>
    :root {
      --page-bg: var(--lux-body-stack, linear-gradient(180deg, #000 0%, #141414 100%));
      --panel: #141414;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f5f3ef;
      --muted: #9b968f;
      --accent: #ebe8e2;
      --accent-hover: #ffffff;
      --accent-purple: #c4b8a8;
      --accent-soft: rgba(255, 255, 255, 0.09);
      --header-bar: #050505;
      --header-end: #0e0e0e;
      --banner-bg: #0a0a0a;
      --cta: #f2efe9;
      --cta-hover: #ffffff;
      --danger: #f87171;
      --shadow: 0 28px 90px rgba(0, 0, 0, 0.55);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; width: 100%; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--page-bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .tk-header {
      background: linear-gradient(180deg, var(--header-bar), var(--header-end));
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    .tk-header-inner {
      max-width: min(1400px, 96vw);
      margin: 0 auto;
      padding: 0.85rem clamp(0.75rem, 3vw, 1.5rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .tk-header-left { display: flex; align-items: center; gap: 0.65rem; }
    .tk-menu-btn {
      width: 42px; height: 42px;
      border: none;
      background: rgba(255,255,255,0.12);
      color: #fff;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tk-menu-btn:hover { background: rgba(255,255,255,0.2); }
    .tk-header .logo { height: 32px; width: auto; max-width: 120px; filter: brightness(0) invert(1); }
    .tk-header a.logo-link { display: flex; align-items: center; }
    .tk-header-util { display: flex; flex-wrap: wrap; gap: 0.25rem; justify-content: flex-end; }
    .tk-header-util a, .tk-header-util button {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 0.65rem;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      color: #fff;
      text-decoration: none;
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .tk-header-util a:hover, .tk-header-util button:hover { background: rgba(255,255,255,0.15); }
    .tk-util-hide-guest { display: none; }
    body.has-session .tk-util-hide-guest { display: inline-flex; }
    body.has-session .tk-util-show-guest { display: none !important; }

    .tk-subbar { background: var(--panel); border-bottom: 1px solid var(--border); }
    .tk-subbar-inner {
      max-width: min(1400px, 96vw);
      margin: 0 auto;
      padding: 1rem clamp(0.75rem, 3vw, 1.5rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .tk-user-block { display: flex; align-items: center; gap: 0.85rem; }
    .tk-avatar {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: linear-gradient(145deg, #2a2a2a, #e8e4dc);
      color: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
      overflow: hidden;
    }
    .tk-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .tk-user-text .welcome { font-size: 0.8rem; color: var(--muted); }
    .tk-user-text .name { font-size: 1.05rem; font-weight: 700; }
    .tk-user-text .member-id { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; }
    .tk-main-nav { display: flex; gap: 0.25rem; flex-wrap: wrap; }
    .tk-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      padding: 0.5rem 1rem;
      min-width: 72px;
      text-decoration: none;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 12px;
    }
    .tk-nav-item svg { width: 24px; height: 24px; stroke-width: 1.75; }
    .tk-nav-item:hover, .tk-nav-item.active { color: var(--accent); background: var(--accent-soft); }

    .tk-banner {
      background: var(--banner-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.55rem 1rem;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .tk-drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(17,24,39,0.45); z-index: 300; }
    .tk-drawer-overlay.open { display: block; }
    .tk-drawer {
      position: fixed; top: 0; left: 0;
      width: min(300px, 88vw); height: 100%;
      background: var(--panel);
      z-index: 301;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      box-shadow: 8px 0 32px rgba(0,0,0,0.12);
      padding: 1.25rem;
    }
    .tk-drawer.open { transform: translateX(0); }
    .tk-drawer a {
      display: flex; align-items: center; gap: 0.65rem;
      padding: 0.75rem;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      border-radius: 10px;
    }
    .tk-drawer a:hover { background: var(--accent-soft); color: var(--accent); }

    .page-main {
      flex: 1;
      width: 100%;
      max-width: min(1400px, 96vw);
      margin: 0 auto;
      padding: 1.25rem clamp(0.75rem, 3vw, 1.5rem) 3rem;
    }
    .events-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding: 1.25rem;
      background: var(--panel);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .filter-field { display: flex; flex-direction: column; gap: 0.4rem; flex: 1 1 140px; min-width: 120px; }
    .filter-field label { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
    .filter-field input, .filter-field select {
      padding: 10px 12px;
      font: inherit;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #121212;
      color: var(--text);
    }
    .filter-actions {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: flex-start;
      gap: 1rem;
      flex: 1 1 100%;
      width: 100%;
      margin-left: 0;
      padding-top: 0.25rem;
    }
    .btn-search {
      padding: 10px 22px;
      font: inherit;
      font-weight: 700;
      color: #0a0a0a;
      background: #f2efe9;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-search:hover {
      color: #0a0a0a;
      background: #ffffff;
      border-color: rgba(255, 255, 255, 0.35);
    }
    .link-clear {
      font-size: 0.9rem;
      font-weight: 600;
      color: #ffffff;
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      padding: 0 !important;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      text-decoration: underline;
    }
    #btnClearSearch {
      color: #ffffff !important;
    }

    .page-title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .page-title-row h1 { font-size: 1.75rem; font-weight: 700; }
    .count { color: var(--muted); font-size: 0.95rem; }

    .events-list { display: flex; flex-direction: column; gap: 1.25rem; }
    /* Slim horizontal cards: fixed thumbnail size (all events same visual weight) */
    .event-row {
      display: grid;
      grid-template-columns: minmax(220px, 260px) minmax(0, 1fr);
      gap: 0;
      align-items: start;
      min-height: 200px;
      background: var(--panel);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .event-row:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    @media (max-width: 900px) {
      .event-row {
        grid-template-columns: 1fr;
        min-height: 0;
      }
    }
    .event-row-image-wrap {
      position: relative;
      width: 100%;
      height: 200px;
      min-height: 200px;
      max-height: 220px;
      flex-shrink: 0;
      background: #0f0f0f;
      overflow: hidden;
      border-radius: 12px 0 0 12px;
    }
    @media (max-width: 900px) {
      .event-row-image-wrap {
        height: 180px;
        min-height: 180px;
        max-height: 220px;
        border-radius: 12px 12px 0 0;
      }
    }
    @media (max-width: 480px) {
      .event-row-image-wrap {
        height: 160px;
        min-height: 160px;
        max-height: 180px;
      }
    }
    .event-row-image-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .badge-tickets {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(242, 239, 233, 0.95);
      color: #0a0a0a;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 8px;
      max-width: calc(100% - 24px);
    }
    .event-row-body {
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      min-width: 0;
      min-height: 200px;
    }
    @media (max-width: 900px) {
      .event-row-body { min-height: 0; }
    }
    .event-row-body h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .event-row-body .shows { font-size: 0.9rem; color: var(--muted); margin-bottom: 0.35rem; }
    .event-row-body .loc {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.95rem;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 0.35rem;
    }
    .event-row-body .loc:hover { text-decoration: underline; }
    .event-row-body .date-line { font-weight: 600; margin-bottom: 0.5rem; }
    .price-from { font-size: 0.9rem; color: var(--muted); margin-bottom: 0.65rem; }
    .price-from strong { color: var(--text); }
    .btn-buy {
      align-self: flex-end;
      margin-top: auto;
      padding: 9px 18px;
      font: inherit;
      font-weight: 700;
      color: #0a0a0a;
      background: #f2efe9;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-buy:hover {
      color: #0a0a0a;
      background: #ffffff;
      border-color: rgba(255, 255, 255, 0.35);
    }

    .empty-msg { text-align: center; color: var(--muted); padding: 3rem 1rem; }

    /* Rules modal (Terms of entry) — z-index above fixed mobile tab bar (~1250) */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(6, 8, 12, 0.78);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 4000;
      align-items: center;
      justify-content: center;
      padding: max(0.75rem, env(safe-area-inset-top, 0px)) 1rem calc(1rem + var(--block-mobile-tab-clearance, 0px) + env(safe-area-inset-bottom, 0px));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      box-sizing: border-box;
    }
    .modal-overlay.show { display: flex; }
    .modal-rules {
      width: 100%;
      max-width: min(760px, 96vw);
      max-height: min(86vh, calc(100dvh - 2rem - var(--block-mobile-tab-clearance, 0px) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)));
      background: #0c0c0c;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }
    .modal-rules-header {
      flex-shrink: 0;
      padding: 1.25rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .modal-rules-header h3 {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--danger);
      font-size: 1.15rem;
      font-weight: 700;
    }
    .modal-rules-body {
      padding: 1.25rem 1.5rem;
      color: #f5f3ef;
      font-size: 1rem;
      line-height: 1.65;
      flex: 1 1 auto;
      min-height: 0;
      max-height: min(calc(86vh - 150px), calc(100dvh - 11rem - var(--block-mobile-tab-clearance, 0px)));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .modal-rules-body ul { margin: 0; padding-left: 1.2rem; }
    .modal-rules-body li { margin-bottom: 0.7rem; }
    .modal-rules-footer {
      flex-shrink: 0;
      padding: 1rem 1.5rem;
      background: #101010;
      display: flex;
      justify-content: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-accept {
      padding: 12px 2.5rem;
      font: inherit;
      font-weight: 700;
      color: #0a0a0a;
      background: #f2efe9;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-accept:hover {
      color: #0a0a0a;
      background: #ffffff;
      border-color: rgba(255,255,255,0.35);
    }

    .site-footer {
      margin-top: auto;
      padding: 2rem 1.25rem;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    .site-footer-inner {
      max-width: min(1400px, 96vw);
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
    }
    .site-footer-links { display: flex; flex-wrap: wrap; gap: 1.25rem; }
    .site-footer-links a { color: var(--muted); text-decoration: none; font-weight: 500; }
    .site-footer-links a:hover { color: var(--accent); }
    .site-footer-copy { color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <header class="site-chrome-header">
    <div class="site-chrome-header__inner">
      <a href="/" class="site-chrome-header__logo-wrap" aria-label="BLOCK Home">
        <img src="/block-logo.png" alt="" class="site-chrome-header__logo-img" width="120" height="26">
      </a>
      <nav class="site-chrome-nav site-chrome-nav--header" aria-label="Main">
        <a href="/" data-nav-match="/">Home</a>
        <a href="/events" data-nav-match="/events">Events</a>
        <a href="/my-tickets" data-nav-match="/my-tickets">My Tickets</a>
        <a href="/contact" data-nav-match="/contact">Contact Us</a>
        <a href="/about-us" data-nav-match="/about-us">About</a>
      </nav>
      <div class="site-chrome-header__account">
        <a href="/profile" class="site-chrome-header__account-link" data-nav-match="/profile" aria-label="Account"></a>
        <a href="/auth" class="site-chrome-header__signin" aria-label="Sign in"></a>
        <button type="button" class="site-chrome-header__signout" id="siteChromeSignOut" hidden aria-label="Sign out"></button>
      </div>
    </div>
  </header>

  <div class="tk-banner">BLOCK is your pass to live events. Browse below, then continue to the event page to choose ticket categories.</div>

  <main class="page-main">
    <div class="page-title-row">
      <h1>Events</h1>
      <span class="count" id="eventsCount"></span>
    </div>

    <section class="events-toolbar" aria-label="Search events">
      <div class="filter-field">
        <label for="filterName">Event Name</label>
        <input type="text" id="filterName" placeholder="Search by name" autocomplete="off">
      </div>
      <div class="filter-field">
        <label for="filterCategory">Event Category</label>
        <select id="filterCategory"><option value="">All categories</option></select>
      </div>
      <div class="filter-field">
        <label for="filterDate">Event Date</label>
        <input type="text" id="filterDate" placeholder="e.g. May 2026" autocomplete="off">
      </div>
      <div class="filter-actions">
        <button type="button" class="btn-search" id="btnSearch">Search</button>
        <button type="button" class="link-clear" id="btnClearSearch">Clear Search</button>
      </div>
    </section>

    <div id="eventsContainer" class="events-list"></div>
    <p id="emptyMsg" class="empty-msg" style="display:none;">No events match your filters.</p>
  </main>

  <div id="rulesOverlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
    <div class="modal-rules">
      <div class="modal-rules-header">
        <h3 id="rulesTitle"><span aria-hidden="true">&#9888;</span> Terms of entry</h3>
      </div>
      <div class="modal-rules-body" id="rulesBody"></div>
      <div class="modal-rules-footer">
        <button type="button" class="btn-accept" id="btnAcceptRules">Accept</button>
      </div>
    </div>
  </div>

  <footer class="site-chrome-footer">
    <div class="site-chrome-footer__inner">
      <a href="/" class="site-chrome-footer__logo-wrap" aria-label="BLOCK Home">
        <img src="/block-logo.png" alt="" class="site-chrome-footer__logo-img" width="100" height="22">
      </a>
      <nav class="site-chrome-nav site-chrome-nav--footer" aria-label="Footer">
        <a href="/" data-nav-match="/">Home</a>
        <a href="/events" data-nav-match="/events">Events</a>
        <a href="/my-tickets" data-nav-match="/my-tickets">My Tickets</a>
        <a href="/contact" data-nav-match="/contact">Contact Us</a>
        <a href="/about-us" data-nav-match="/about-us">About</a>
      </nav>
      <span class="site-chrome-footer__copy" id="siteChromeCopyright">© BLOCK</span>
    </div>
  </footer>

  <script src="/site-chrome.js" defer></script>
  <script>
    var allEvents = [];
    var pendingBuyEventId = null;

    function moneyMin(events) {
      var prices = events.map(function (e) { return Number(e.price || 0); }).filter(function (p) { return p > 0; });
      if (!prices.length) return 0;
      return Math.min.apply(null, prices);
    }

    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function mapsLink(venue) {
      if (!venue) return '#';
      return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(venue);
    }

    function renderEvents(events) {
      var container = document.getElementById('eventsContainer');
      var emptyMsg = document.getElementById('emptyMsg');
      var countEl = document.getElementById('eventsCount');
      if (!events.length) {
        container.innerHTML = '';
        emptyMsg.style.display = 'block';
        countEl.textContent = '0 events';
        return;
      }
      emptyMsg.style.display = 'none';
      countEl.textContent = events.length + (events.length === 1 ? ' event' : ' events');
      container.innerHTML = events.map(function (event) {
        var minP = Number(event.price || 0);
        var priceLabel = minP > 0 ? '<strong>' + minP.toFixed(0) + ' EGP</strong>' : '<strong>FREE</strong>';
        return (
          '<article class="event-row" data-eid="' + escapeHtml(event.id) + '">' +
            '<div class="event-row-image-wrap">' +
              '<img src="' + escapeHtml(event.imageCard || event.image || '/block-logo.png') + '" alt="">' +
              '<span class="badge-tickets">Tickets available at BLOCK</span>' +
            '</div>' +
            '<div class="event-row-body">' +
              '<h2>' + escapeHtml(event.name) + '</h2>' +
              '<div class="shows">No. of shows: 1</div>' +
              '<a class="loc" href="' + escapeHtml(mapsLink(event.venue)) + '" target="_blank" rel="noopener">&#128205; ' + escapeHtml(event.venue || 'Venue TBA') + '</a>' +
              '<div class="date-line">' + escapeHtml([event.date, event.time].filter(Boolean).join(' · ')) + '</div>' +
              '<div class="price-from">Prices from: ' + priceLabel + '</div>' +
              '<button type="button" class="btn-buy" data-buy="' + escapeHtml(event.id) + '">Buy Tickets</button>' +
            '</div>' +
          '</article>'
        );
      }).join('');

      container.querySelectorAll('[data-buy]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          pendingBuyEventId = btn.getAttribute('data-buy');
          openRulesForEvent(pendingBuyEventId);
        });
      });

      var articles = container.querySelectorAll('article.event-row[data-eid]');
      var ids = Array.prototype.slice.call(articles).map(function (a) {
        return a.getAttribute('data-eid');
      }).filter(Boolean);
      if (!ids.length) return;
      fetch('/api/event-thumbs?ids=' + encodeURIComponent(ids.join(',')))
        .then(function (r) { return r.json(); })
        .then(function (map) {
          if (!map || typeof map !== 'object') return;
          Array.prototype.forEach.call(articles, function (art) {
            var id = art.getAttribute('data-eid');
            if (!id || !map[id]) return;
            var im = art.querySelector('.event-row-image-wrap img');
            if (im) im.src = map[id];
          });
        })
        .catch(function () {});
    }

    function openRulesForEvent(eventId) {
      var overlay = document.getElementById('rulesOverlay');
      var body = document.getElementById('rulesBody');
      body.innerHTML = '<p>Loading…</p>';
      overlay.classList.add('show');
      fetch('/api/booking-event/' + encodeURIComponent(eventId))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (!data || data.error) throw new Error(data.error || 'Could not load rules.');
          var rules = data.rules || {};
          var terms = String(rules.termsText || '').trim();
          var bullets = terms ? terms.split(/\n+/).map(function (l) { return l.replace(/^[-•]\s*/, '').trim(); }).filter(Boolean) : [];
          if (!bullets.length) {
            bullets = [
              'Tickets are non-refundable unless the event is cancelled.',
              'Follow venue rules and staff instructions.',
              'Prohibited items may be refused at entry.',
            ];
          }
          body.innerHTML = '<ul>' + bullets.map(function (b) { return '<li>' + escapeHtml(b) + '</li>'; }).join('') + '</ul>';
        })
        .catch(function (e) {
          body.innerHTML = '<p>' + escapeHtml(e.message || 'Could not load terms.') + '</p>';
        });
    }

    document.getElementById('btnAcceptRules').addEventListener('click', function () {
      if (!pendingBuyEventId) return;
      try {
        sessionStorage.setItem('block_rules_ok_' + pendingBuyEventId, '1');
      } catch (e) {}
      location.href = '/event/' + encodeURIComponent(pendingBuyEventId) + '?rules=1';
    });

    document.getElementById('rulesOverlay').addEventListener('click', function (e) {
      if (e.target === this) this.classList.remove('show');
    });

    function buildCategoryOptions(events) {
      var sel = document.getElementById('filterCategory');
      var cats = [];
      events.forEach(function (e) {
        if (e.category && cats.indexOf(e.category) === -1) cats.push(e.category);
      });
      cats.sort();
      var cur = sel.value;
      sel.innerHTML = '<option value="">All categories</option>';
      cats.forEach(function (c) {
        var o = document.createElement('option');
        o.value = c;
        o.textContent = c;
        if (c === cur) o.selected = true;
        sel.appendChild(o);
      });
    }

    function applyFilters() {
      var nameQ = (document.getElementById('filterName').value || '').toLowerCase().trim();
      var cat = document.getElementById('filterCategory').value;
      var dateQ = (document.getElementById('filterDate').value || '').toLowerCase().trim();
      var list = allEvents.filter(function (e) {
        if (nameQ && (!e.name || e.name.toLowerCase().indexOf(nameQ) === -1)) return false;
        if (cat && e.category !== cat) return false;
        if (dateQ) {
          var d = (e.date || '') + ' ' + (e.time || '');
          if (d.toLowerCase().indexOf(dateQ) === -1) return false;
        }
        return true;
      });
      renderEvents(list);
    }

    document.getElementById('btnSearch').addEventListener('click', applyFilters);
    document.getElementById('btnClearSearch').addEventListener('click', function () {
      document.getElementById('filterName').value = '';
      document.getElementById('filterCategory').value = '';
      document.getElementById('filterDate').value = '';
      applyFilters();
    });

    function loadEvents() {
      fetch('/api/events?compact=1')
        .then(function (r) { return r.json(); })
        .then(function (events) {
          if (!Array.isArray(events)) events = [];
          var params = new URLSearchParams(location.search);
          var q = (params.get('q') || '').toLowerCase().trim();
          if (q) {
            events = events.filter(function (e) {
              return (e.name && e.name.toLowerCase().indexOf(q) !== -1) ||
                (e.venue && e.venue.toLowerCase().indexOf(q) !== -1);
            });
            document.getElementById('filterName').value = q;
          }
          allEvents = events;
          buildCategoryOptions(events);
          applyFilters();
        })
        .catch(function () {
          document.getElementById('emptyMsg').textContent = 'Could not load events.';
          document.getElementById('emptyMsg').style.display = 'block';
        });
    }

    loadEvents();
  </script>
</body>
</html>
